# Menu de démarrage du live, commun au BIOS et à l'UEFI (§15).
set default=0
set timeout=5

# Une police pour les accents du menu ; sans elle, on reste en mode texte.
if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod all_video
    insmod gfxterm
    set gfxmode=auto
    terminal_output gfxterm
fi

menuentry "CloneGator - clavier Français (Canada)" {
    linux /live/vmlinuz boot=live quiet clonegator.clavier=ca
    initrd /live/initrd.img
}
menuentry "CloneGator - clavier Canadien multilingue" {
    linux /live/vmlinuz boot=live quiet clonegator.clavier=ca:multix
    initrd /live/initrd.img
}
menuentry "CloneGator - clavier Anglais (États-Unis)" {
    linux /live/vmlinuz boot=live quiet clonegator.clavier=us
    initrd /live/initrd.img
}
